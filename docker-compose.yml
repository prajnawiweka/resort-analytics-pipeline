services:
  postgres:
    image: postgres:16
    container_name: resort-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resort}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline_rw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume
      - ./sql/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline_rw} -d ${POSTGRES_DB:-resort}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
