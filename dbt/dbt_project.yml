name: resort_analytics
version: "0.1.0"
config-version: 2
profile: resort_analytics

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  resort_analytics:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      # Tables, not views: dashboards query them on every page load
      +materialized: table
