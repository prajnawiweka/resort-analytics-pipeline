name: resort_analytics
version: "0.1.0"
config-version: 2
profile: resort_analytics

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  resort_analytics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      # Tables, not views: dashboards query them on every page load
      +materialized: table

seeds:
  resort_analytics:
    +schema: reference
    channels:
      +column_types:
        commission_rate: "numeric(5, 4)"
    properties:
      +column_types:
        opening_date: date

vars:
  # Business timezone: all local dates and times are Bali time (WITA, UTC+8)
  local_timezone: Asia/Makassar
  # A low rating, on the 1-5 scale
  low_rating_threshold: 4
